<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anteprima componenti Figma</title>
<link rel="stylesheet" href="resources/css/tokens.css">
<link rel="stylesheet" href="resources/css/components.css">
<style>
  body { margin: 0; background: var(--surface-background); }
  .demo { display: flex; gap: 16px; flex-wrap: wrap; padding: 24px; }
</style>
</head>
<body>
  <!-- Stesso markup prodotto da fx-login.jsp + fx-input.jsp -->
  <div class="fx-element fx-login">
    <div class="fx-login__inner">
      <header class="fx-login__header">
        <div class="fx-login__logo" aria-hidden="true">A</div>
        <h1 class="fx-login__title">Bentornato</h1>
        <p class="fx-login__subtitle">Accedi per continuare sul tuo account</p>
      </header>
      <form class="fx-login__card" method="post" action="#">
        <div class="fx-input">
          <label class="fx-input__label" for="email">Email</label>
          <input class="fx-input__field" id="email" name="email" type="email" placeholder="nome@esempio.it" autocomplete="email" required>
        </div>
        <div class="fx-input">
          <label class="fx-input__label" for="password">Password</label>
          <input class="fx-input__field" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <a class="fx-login__forgot" href="#">Password dimenticata?</a>
        <button class="fx-button fx-button--primary fx-button--full" type="submit">Accedi</button>
        <a class="fx-button fx-button--secondary fx-button--full" href="#">Continua con Google</a>
      </form>
      <p class="fx-login__footer">Non hai un account? <a href="#">Registrati</a></p>
    </div>
  </div>

  <!-- Stesso markup prodotto da fx-cta-button.jsp -->
  <div class="demo">
    <div class="fx-element fx-cta-button"><a class="fx-button fx-button--primary" href="#">Accedi</a></div>
    <div class="fx-element fx-cta-button"><a class="fx-button fx-button--secondary" href="#">Accedi</a></div>
  </div>
</body>
</html>
